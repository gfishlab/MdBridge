name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rustTargets: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rustTargets: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          section="$(awk -v ver="$version" '
            $0 ~ "^## v" ver "$" { capture=1; next }
            capture && /^## v/ { exit }
            capture { print }
          ' CHANGELOG.md)"
          {
            echo "body<<__CHANGELOG_EOF__"
            if [ -n "$(printf '%s' "$section" | tr -d '[:space:]')" ]; then
              printf '%s\n' "$section"
            fi
            echo ""
            echo "---"
            echo ""
            echo "请在下方 Assets 中下载对应平台的安装包。"
            echo ""
            echo "- macOS：下载 \`.dmg\`"
            echo "- Windows：下载 \`.exe\` 或 \`.msi\`"
            echo "- Linux：下载 \`.AppImage\`、\`.deb\` 或 \`.rpm\`"
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          tagName: v__VERSION__
          releaseName: MDBridge v__VERSION__
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
